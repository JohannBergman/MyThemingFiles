# vim:ft=kitty
#: This is a template that can be used to create new kitty themes.
#: Theme files should start with a metadata block consisting of
#: lines beginning with ##. All metadata fields are optional.

## name: Box
## author: D3vil0p3r
## license: GPLv3
## blurb: Hack The Box inspired colorscheme.

#: All the settings below are colors, which you can choose to modify, or use the
#: defaults. You can also add non-color based settings if needed but note that
#: these will not work with using kitty @ set-colors with this theme. For a
#: reference on what these settings do see https://sw.kovidgoyal.net/kitty/conf/

# BEGIN_KITTY_FONTS
font_family      family="BigBlueTerm437 Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

enable_background_blur yes
background_opacity 0.9

#: The basic colors

foreground                      #fcf5fb
background                      #6d3f85
selection_foreground            #6d3f85
selection_background            #fcf5fb


#: Cursor colors

cursor                          #ac3232
cursor_text_color               #111111


#: URL underline color when hovering with mouse

url_color                       #2ee7b6


#: kitty window border colors and terminal bell colors

#active_border_color             #00ff00
#inactive_border_color           #cccccc
#bell_border_color               #ff5a00
#visual_bell_color               none


#: OS Window titlebar colors

#wayland_titlebar_color          system
#macos_titlebar_color            system


#: Tab bar colors

#active_tab_foreground           #141d2b
#active_tab_background           #9fef00
#inactive_tab_foreground         #141d2b
#inactive_tab_background         #a4b1cd
#tab_bar_background              none
#tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

mark1_foreground black
mark1_background #9fef00
mark2_foreground black
mark2_background #9fef00
mark3_foreground black
mark3_background #9fef00


#: The basic 16 colors

#: black
color0 #000000
color8 #767676

#: red
color1 #dd4df6
color9 #fc77f6

#: green
color2  #198176
color10 #24b173

#: yellow
color3  #6a4f6d
color11 #cca095

#: blue
color4  #789be6
color12 #8fd6fe

#: magenta
color5  #b866b0
color13 #b866b0
#: cyan
color6  #0dcdcd
color14 #14ffff

#: white
color7  #dddddd
color15 #ffffff
